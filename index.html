<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071726" />
    <title>3D Story Experience</title>

    <style>
      :root {
        --bg-1: #07111d;
        --bg-2: #0d2740;
        --cyan: rgba(206, 239, 255, .82);
        --cyan-2: rgba(255, 255, 255, .96);
        --line-soft: rgba(190, 229, 255, 0.14);
        --text: rgba(238, 248, 255, 0.78);
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg-1);
      }

      body { overflow: hidden; }

      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.42s cubic-bezier(.22, 1, .36, 1);
      }

      body.site-ready {
        overflow-x: hidden;
        overflow-y: auto;
      }

      body.site-ready #root {
        opacity: 1;
      }

      /* ============================================
         FULL SCREEN LOADER
      ============================================ */

      #h-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        overflow: hidden;

        background:
          radial-gradient(circle at 34% 34%, rgba(77, 171, 226, .18), transparent 28%),
          radial-gradient(circle at 67% 58%, rgba(125, 195, 238, .13), transparent 25%),
          radial-gradient(circle at 51% 44%, rgba(255,255,255,.035), transparent 42%),
          linear-gradient(145deg, var(--bg-2), var(--bg-1) 70%);

        opacity: 1;
        visibility: visible;
      }

      #h-preloader.is-exiting {
        animation: loaderExit 0.45s cubic-bezier(.4, 0, 1, 1) forwards;
      }

      .loader-center {
        width: min(86vw, 380px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-1.2vh);
      }

      /* ============================================
         MAIN STAGE
      ============================================ */

      .h-stage {
        position: relative;
        width: 205px;
        height: 315px;
        max-width: 50vw;
        max-height: 62vh;
        perspective: 950px;
        transform-style: preserve-3d;
      }

      .morph-svg,
      .thread-svg,
      .h-3d-wrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Circle -> H morph outline */
      .morph-svg {
        overflow: visible;
        filter:
          drop-shadow(0 0 5px rgba(219, 245, 255, 0.24))
          drop-shadow(0 0 16px rgba(108, 186, 230, 0.10));
      }

      #morph-polygon {
        fill: rgba(118, 211, 255, 0.025);
        stroke: var(--cyan);
        stroke-width: 1.65;
        vector-effect: non-scaling-stroke;
        stroke-linejoin: round;
        opacity: 1;
      }

      #morph-runner {
        fill: none;
        stroke: var(--cyan-2);
        stroke-width: 2.6;
        vector-effect: non-scaling-stroke;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 10 90;
        opacity: 0.92;
        filter: drop-shadow(0 0 7px rgba(215, 247, 255, 0.8));
      }

      /* ============================================
         THREADS / STRINGS
      ============================================ */

      .thread-svg {
        overflow: visible;
        pointer-events: none;
        opacity: 0.78;
        mix-blend-mode: screen;
      }

      .thread {
        fill: none;
        stroke: rgba(134, 217, 255, 0.38);
        stroke-width: 0.72;
        vector-effect: non-scaling-stroke;
        stroke-linecap: round;
        filter: drop-shadow(0 0 4px rgba(114, 206, 255, 0.3));
      }

      .thread.t1 { animation: threadUp 1.45s ease-in-out infinite; }
      .thread.t2 { animation: threadDown 1.25s ease-in-out .08s infinite; }
      .thread.t3 { animation: threadUp 1.75s ease-in-out .12s infinite; }
      .thread.t4 { animation: threadDown 1.55s ease-in-out .20s infinite; }
      .thread.t5 { animation: threadUp 1.32s ease-in-out .05s infinite; }
      .thread.t6 { animation: threadDown 1.82s ease-in-out .16s infinite; }
      .thread.t7 { animation: threadUp 1.62s ease-in-out .09s infinite; }
      .thread.t8 { animation: threadDown 1.38s ease-in-out .18s infinite; }

      /* ============================================
         3D H — THREE RECTANGULAR PRISMS
      ============================================ */

      .h-3d-wrap {
        display: grid;
        place-items: center;
        transform-style: preserve-3d;
        opacity: 0;
        transform: rotateX(-7deg) rotateY(-14deg) translateZ(0) scale(.91);
        will-change: transform, opacity;
      }

      .h-3d {
        position: relative;
        width: 138px;
        height: 236px;
        transform-style: preserve-3d;
        animation: hFloat 2.2s ease-in-out infinite;
        filter:
          drop-shadow(0 0 10px rgba(84, 190, 255, .34))
          drop-shadow(0 0 30px rgba(35, 125, 255, .20));
      }

      /* soft neutral aura behind the final H */
      .h-3d::before {
        content: '';
        position: absolute;
        inset: 10% -34%;
        z-index: -2;
        border-radius: 50%;
        background:
          radial-gradient(circle at 48% 48%,
            rgba(194, 231, 250, .10),
            rgba(73, 151, 201, .045) 45%,
            transparent 72%);
        filter: blur(24px);
        transform: translateZ(-30px);
        animation: liquidAura 2.8s ease-in-out infinite;
      }

      .cuboid {
        position: absolute;
        transform-style: preserve-3d;
      }

      .cuboid.vertical {
        width: 34px;
        height: 236px;
        top: 0;
      }

      .cuboid.left { left: 0; }
      .cuboid.right { right: 0; }

      .cuboid.bridge {
        width: 104px;
        height: 34px;
        left: 17px;
        top: 101px;
      }

      /* iPhone-style LIQUID GLASS material:
         almost clear, soft blur, lens-like rim and subtle refraction. */
      .face {
        position: absolute;
        backface-visibility: hidden;
        overflow: hidden;

        border: 1px solid rgba(238, 250, 255, .28);
        background: rgba(184, 225, 248, .055);

        backdrop-filter:
          blur(18px)
          saturate(150%)
          contrast(106%);
        -webkit-backdrop-filter:
          blur(18px)
          saturate(150%)
          contrast(106%);

        box-shadow:
          inset 1px 1px 0 rgba(255,255,255,.34),
          inset -1px -1px 0 rgba(115,183,225,.10),
          inset 0 0 18px rgba(225,246,255,.055),
          0 7px 22px rgba(0, 8, 18, .14);

        border-radius: 5px;
      }

      .vertical .front,
      .vertical .back {
        width: 34px;
        height: 236px;
      }

      .bridge .front,
      .bridge .back {
        width: 104px;
        height: 34px;
      }

      .front {
        transform: translateZ(12px);
        background:
          radial-gradient(circle at 25% 13%,
            rgba(255,255,255,.28),
            transparent 20%),
          radial-gradient(circle at 75% 78%,
            rgba(130,205,245,.11),
            transparent 30%),
          linear-gradient(128deg,
            rgba(255,255,255,.115) 0%,
            rgba(198,234,252,.055) 32%,
            rgba(107,181,224,.038) 63%,
            rgba(255,255,255,.085) 100%);

        box-shadow:
          inset 1px 1px 0 rgba(255,255,255,.48),
          inset -1px -1px 0 rgba(113,181,222,.11),
          inset 0 0 22px rgba(224,247,255,.055),
          0 9px 26px rgba(0,8,18,.16);
      }

      /* lens/specular sweep — white, not neon */
      .front::after {
        content: '';
        position: absolute;
        top: -32%;
        left: -165%;
        width: 82%;
        height: 165%;
        transform: skewX(-16deg);
        background:
          linear-gradient(90deg,
            transparent 0%,
            rgba(255,255,255,.02) 28%,
            rgba(255,255,255,.42) 49%,
            rgba(214,242,255,.10) 64%,
            transparent 100%);
        filter: blur(2.8px);
        animation: liquidSweep 2.25s cubic-bezier(.45,0,.2,1) infinite;
        mix-blend-mode: screen;
      }

      .front::before {
        content: '';
        position: absolute;
        inset: 1px;
        border-radius: 4px;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 32% 18%,
            rgba(255,255,255,.18),
            transparent 38%),
          radial-gradient(ellipse at 70% 80%,
            rgba(122,199,239,.08),
            transparent 45%);
        opacity: .85;
      }

      .back {
        transform: rotateY(180deg) translateZ(12px);
        background:
          linear-gradient(140deg,
            rgba(222,245,255,.045),
            rgba(93,167,211,.035));
        border-color: rgba(208, 239, 255, .16);
      }

      .vertical .left-face,
      .vertical .right-face {
        width: 24px;
        height: 236px;
        left: 5px;
      }

      .bridge .left-face,
      .bridge .right-face {
        width: 24px;
        height: 34px;
        left: 40px;
      }

      .left-face {
        transform: rotateY(-90deg) translateZ(17px);
        background:
          linear-gradient(180deg,
            rgba(214,242,255,.085),
            rgba(74,145,190,.045));
        border-color: rgba(214,241,255,.16);
      }

      .right-face {
        transform: rotateY(90deg) translateZ(17px);
        background:
          linear-gradient(180deg,
            rgba(255,255,255,.15),
            rgba(119,190,229,.055));
        border-color: rgba(246,252,255,.25);
      }

      .vertical .top-face,
      .vertical .bottom-face {
        width: 34px;
        height: 24px;
        top: 106px;
      }

      .bridge .top-face,
      .bridge .bottom-face {
        width: 104px;
        height: 24px;
        top: 5px;
      }

      .top-face {
        transform: rotateX(90deg) translateZ(118px);
        transform-origin: center;
        background:
          linear-gradient(90deg,
            rgba(255,255,255,.18),
            rgba(177,224,247,.06));
        border-color: rgba(248,253,255,.25);
      }

      .bottom-face {
        transform: rotateX(-90deg) translateZ(118px);
        transform-origin: center;
        background:
          linear-gradient(90deg,
            rgba(110,184,224,.045),
            rgba(218,243,255,.035));
        border-color: rgba(184,224,245,.12);
      }

      .bridge .top-face {
        transform: rotateX(90deg) translateZ(17px);
      }

      .bridge .bottom-face {
        transform: rotateX(-90deg) translateZ(17px);
      }

      /* liquid light moving inside H */
      .h-shimmer {
        position: absolute;
        inset: -3px;
        pointer-events: none;
        overflow: hidden;
        opacity: .42;
        mix-blend-mode: screen;
        filter: blur(.45px);
      }

      .h-shimmer::before,
      .h-shimmer::after {
        content: '';
        position: absolute;
        width: 2px;
        height: 82%;
        top: 9%;
        border-radius: 999px;
        background: linear-gradient(to bottom,
          transparent,
          rgba(230,247,255,.06),
          rgba(255,255,255,.72),
          rgba(178,224,247,.08),
          transparent);
        box-shadow:
          0 0 6px rgba(255,255,255,.35),
          0 0 14px rgba(122,194,233,.12);
      }

      .h-shimmer::before {
        left: 31%;
        animation: shimmerUp 1.18s ease-in-out infinite;
      }

      .h-shimmer::after {
        right: 31%;
        animation: shimmerDown 1.36s ease-in-out .10s infinite;
      }

      /* ============================================
         PROGRESS
      ============================================ */

      .progress-wrap {
        width: 205px;
        max-width: 58vw;
        margin-top: 18px;
        opacity: 0;
        transform: translateY(7px);
        animation: progressReveal .35s ease .42s forwards;
      }

      .progress-track {
        position: relative;
        width: 100%;
        height: 1px;
        overflow: hidden;
        background: rgba(164, 218, 247, 0.15);
      }

      .progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg,
          rgba(158,211,241,.72),
          rgba(255,255,255,.96));
        box-shadow: 0 0 8px rgba(168, 220, 247, 0.20);
        will-change: width;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9px;
        line-height: 1;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .progress-number {
        min-width: 34px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
      }

      /* ============================================
         KEYFRAMES
      ============================================ */

      @keyframes loaderExit {
        0% {
          opacity: 1;
          filter: blur(0);
          transform: scale(1);
        }
        100% {
          opacity: 0;
          filter: blur(8px);
          transform: scale(1.025);
          visibility: hidden;
          pointer-events: none;
        }
      }

      @keyframes liquidSweep {
        0% { left: -190%; opacity: 0; }
        14% { opacity: .9; }
        62% { opacity: .65; }
        100% { left: 215%; opacity: 0; }
      }

      @keyframes liquidAura {
        0%,100% { opacity: .42; transform: translateZ(-30px) scale(.96); }
        50% { opacity: .70; transform: translateZ(-30px) scale(1.045); }
      }

      @keyframes progressReveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes hFloat {
        0%, 100% {
          transform: translate3d(0, 0, 0) rotateZ(0deg);
        }
        25% {
          transform: translate3d(0, -5px, 4px) rotateZ(.35deg);
        }
        50% {
          transform: translate3d(0, 1px, 8px) rotateZ(0deg);
        }
        75% {
          transform: translate3d(0, 5px, 3px) rotateZ(-.35deg);
        }
      }

      @keyframes threadUp {
        0%, 100% { transform: translateY(12px); opacity: .2; }
        50% { transform: translateY(-18px); opacity: .72; }
      }

      @keyframes threadDown {
        0%, 100% { transform: translateY(-12px); opacity: .18; }
        50% { transform: translateY(19px); opacity: .68; }
      }

      @keyframes shimmerUp {
        0%,100% { transform: translateY(25%); opacity: .12; }
        50% { transform: translateY(-25%); opacity: .8; }
      }

      @keyframes shimmerDown {
        0%,100% { transform: translateY(-25%); opacity: .1; }
        50% { transform: translateY(25%); opacity: .75; }
      }

      @media (max-width: 600px) {
        .h-stage {
          width: 174px;
          height: 270px;
        }

        .progress-wrap {
          width: 174px;
        }

        .h-3d {
          transform: scale(.86);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .thread,
        .h-3d,
        .h-shimmer::before,
        .h-shimmer::after {
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- PRELOADER -->
    <div id="h-preloader" aria-label="Loading">
      <div class="loader-center">
        <div class="h-stage" aria-hidden="true">

          <!-- 1) Circle morphs into H outline -->
          <svg class="morph-svg" viewBox="0 0 205 315">
            <polygon id="morph-polygon" points="" />
            <polyline id="morph-runner" points="" />
          </svg>

          <!-- 2) Moving thread / string field -->
          <svg class="thread-svg" viewBox="0 0 205 315">
            <path class="thread t1" d="M26 48 C42 96, 8 164, 30 258" />
            <path class="thread t2" d="M52 20 C28 94, 70 162, 47 294" />
            <path class="thread t3" d="M76 35 C94 112, 49 180, 75 276" />
            <path class="thread t4" d="M96 6 C80 96, 116 188, 92 310" />
            <path class="thread t5" d="M116 20 C138 92, 98 185, 126 294" />
            <path class="thread t6" d="M140 40 C117 110, 161 185, 143 272" />
            <path class="thread t7" d="M165 18 C143 96, 187 168, 166 294" />
            <path class="thread t8" d="M184 52 C163 115, 203 180, 178 258" />
          </svg>

          <!-- 3) Final 3D H -->
          <div class="h-3d-wrap" id="h-3d-wrap">
            <div class="h-3d">
              <div class="cuboid vertical left">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face left-face"></div>
                <div class="face right-face"></div>
                <div class="face top-face"></div>
                <div class="face bottom-face"></div>
              </div>

              <div class="cuboid vertical right">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face left-face"></div>
                <div class="face right-face"></div>
                <div class="face top-face"></div>
                <div class="face bottom-face"></div>
              </div>

              <div class="cuboid bridge">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face left-face"></div>
                <div class="face right-face"></div>
                <div class="face top-face"></div>
                <div class="face bottom-face"></div>
              </div>

              <div class="h-shimmer"></div>
            </div>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>

          <div class="progress-meta">
            <span>Loading</span>
            <span class="progress-number" id="progress-number">01</span>
          </div>
        </div>
      </div>
    </div>

    <!-- REACT APP -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (() => {
        const TOTAL_TIME = 4000;
        const EXIT_START = 3550;

        const fill = document.getElementById('progress-fill');
        const number = document.getElementById('progress-number');
        const preloader = document.getElementById('h-preloader');
        const polygon = document.getElementById('morph-polygon');
        const runner = document.getElementById('morph-runner');
        const h3d = document.getElementById('h-3d-wrap');

        const N = 96;

        const clamp01 = (v) => Math.max(0, Math.min(1, v));
        const smoothstep = (t) => {
          t = clamp01(t);
          return t * t * (3 - 2 * t);
        };

        function sampleCircle(count) {
          const cx = 102.5;
          const cy = 151;
          const rx = 67;
          const ry = 67;
          const pts = [];

          for (let i = 0; i < count; i++) {
            const a = (-Math.PI / 2) + (i / count) * Math.PI * 2;
            pts.push([
              cx + Math.cos(a) * rx,
              cy + Math.sin(a) * ry,
            ]);
          }

          return pts;
        }

        /* Closed H silhouette, sampled evenly around the perimeter */
        const hVertices = [
          [47, 36],
          [78, 36],
          [78, 128],
          [127, 128],
          [127, 36],
          [158, 36],
          [158, 278],
          [127, 278],
          [127, 174],
          [78, 174],
          [78, 278],
          [47, 278],
        ];

        function sampleClosedPolygon(vertices, count) {
          const segments = [];
          let total = 0;

          for (let i = 0; i < vertices.length; i++) {
            const a = vertices[i];
            const b = vertices[(i + 1) % vertices.length];
            const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
            segments.push({ a, b, len, start: total });
            total += len;
          }

          const result = [];

          for (let i = 0; i < count; i++) {
            const d = (i / count) * total;
            const seg = segments.find(s => d >= s.start && d < s.start + s.len) || segments[segments.length - 1];
            const local = (d - seg.start) / seg.len;
            result.push([
              seg.a[0] + (seg.b[0] - seg.a[0]) * local,
              seg.a[1] + (seg.b[1] - seg.a[1]) * local,
            ]);
          }

          return result;
        }

        const circlePts = sampleCircle(N);
        const hPts = sampleClosedPolygon(hVertices, N);

        function setPoints(el, pts, close = false) {
          const list = pts.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`);
          if (close) list.push(`${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`);
          el.setAttribute('points', list.join(' '));
        }

        setPoints(polygon, circlePts);
        setPoints(runner, circlePts, true);

        let start = null;
        let exitTriggered = false;

        function frame(now) {
          if (!start) start = now;

          const elapsed = Math.min(TOTAL_TIME, now - start);
          const global = elapsed / TOTAL_TIME;

          /* Loading 01 -> 100 through the whole 4 seconds */
          const percent = Math.max(1, Math.round(global * 100));
          fill.style.width = `${global * 100}%`;
          number.textContent = String(percent).padStart(2, '0');

          /* 0.0s - 0.65s: circle draws and breathes */
          const circleBuild = smoothstep(elapsed / 650);
          polygon.style.opacity = String(0.25 + 0.75 * circleBuild);
          polygon.style.strokeDasharray = '1';
          polygon.style.strokeDashoffset = String(1 - circleBuild);

          /* 0.65s - 2.15s: circle morphs into H outline */
          const morphT = smoothstep((elapsed - 650) / 1500);
          const pts = circlePts.map((p, i) => {
            const q = hPts[i];

            /* slight living thread wobble during morph */
            const wobble = Math.sin(i * 0.53 + elapsed * 0.008) * (1 - morphT) * 2.3;

            return [
              p[0] + (q[0] - p[0]) * morphT + wobble,
              p[1] + (q[1] - p[1]) * morphT,
            ];
          });

          setPoints(polygon, pts);
          setPoints(runner, pts, true);

          runner.style.strokeDashoffset = String(-elapsed * 0.055);

          /* 1.75s - 2.65s: 3D H rises out of the outline */
          const reveal3D = smoothstep((elapsed - 1750) / 900);
          h3d.style.opacity = String(reveal3D);

          const scale = 0.91 + reveal3D * 0.09;
          const rotY = -14 + reveal3D * 9;
          const rotX = -7 + reveal3D * 2;
          const lift = (1 - reveal3D) * 12;

          h3d.style.transform = `translateY(${lift}px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${scale})`;

          /* Morph outline hands the scene over to the solid H */
          const outlineFade = 1 - smoothstep((elapsed - 2050) / 650);
          polygon.style.opacity = String(Math.max(0.04, outlineFade));
          runner.style.opacity = String(Math.max(0.08, outlineFade * 0.92));

          /* 2.65s - 3.55s: H stays clearly visible and alive */
          if (elapsed > 2650) {
            const holdPulse = 1 + Math.sin((elapsed - 2650) * 0.006) * 0.004;
            h3d.style.transform = `rotateX(-5deg) rotateY(-5deg) scale(${holdPulse})`;
          }

          /* 3.55s - 4.00s: H is still visible while loader fades out */
          if (elapsed >= EXIT_START && !exitTriggered) {
            exitTriggered = true;
            preloader.classList.add('is-exiting');
            document.body.classList.add('site-ready');

            // IMPORTANT: keep #root untransformed so position:fixed WebGL/UI
            // remains fixed to the viewport while page scroll drives the 3D scene.
            const root = document.getElementById('root');
            if (root) root.style.transform = 'none';
          }

          if (elapsed < TOTAL_TIME) {
            requestAnimationFrame(frame);
            return;
          }

          number.textContent = '100';
          fill.style.width = '100%';

          setTimeout(() => {
            preloader?.remove();
          }, 80);
        }

        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
